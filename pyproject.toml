[project]
# The distribution name is the ONE place the PyPI name lives (scripts/dist_name.py).
# E1 (Ch.8.10): `locusfiles` (W26, IP-008); `locus` is taken on PyPI. Import name and CLI stay `locus`.
name = "locusfiles"
dynamic = ["version"]  # from src/locus/__init__.py (__version__), see [tool.hatch.version]
description = "Local-first search over your own folders for MCP clients that can start a local server; search results name the file they came from."
readme = "docs/package/README.md"  # public PyPI page; the repo README is internal (F8)
requires-python = ">=3.11"
# Licence changed to PolyForm Noncommercial 1.0.0 on 2026-11-14 (licensor Yonathan Levy; 0.1.x was FSL-1.1-ALv2).
# PEP 639 SPDX expression; the licence covers the engine only, so its text lives next to the engine and ships in
# the wheel's dist-info/licenses/. There is no Trove classifier for it, and PEP 639 forbids a License:: classifier
# next to a licence expression.
# LEG-014: NOTICE and the third-party licence inventory (scripts/licence_inventory.py writes it) ship
# the same way; scripts/check_dist_contents.py fails a build whose sdist or wheel lacks any of them.
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["src/locus/LICENSE", "src/locus/NOTICE", "src/locus/THIRD_PARTY_LICENSES.md"]
dependencies = [
  "mcp>=2.2,<2.3",
  "chromadb>=1.5,<1.6",
  "pydantic>=2.5",
  "python-dotenv>=1.0",
  "watchdog>=4.0",
  "pypdfium2>=4.30",
  "python-docx>=1.1",
]

[project.optional-dependencies]
voyage = ["voyageai>=0.3"]
openai = ["openai>=1.30"]
local = ["fastembed>=0.9,<1"]  # ONNX Runtime: about 530 MB installed with the default model (PyTorch route: about 1.2 GB)
local-torch = ["sentence-transformers>=3.0"]  # PyTorch route: local models fastembed does not list (checked against fastembed 0.9.1, 2026-11-17: bge-m3, multilingual-e5-base, model folders)
lancedb = ["lancedb>=0.15"]
relay = ["realtime>=2.31,<2.32", "httpx>=0.27", "cryptography>=42"]  # cryptography: SEC-021 request verification
# hatchling: the build backend below, in the dev extra so a checkout can build its wheel offline
# (`python -m build --no-isolation`) instead of downloading the backend.
dev = ["pytest>=8.0", "ruff>=0.6", "hatchling>=1.27,<2"]

[project.scripts]
locus = "locus.cli:main"
locusfiles = "locus.cli:main"  # so `uvx locusfiles ...` (the PyPI name, as MCP registry clients run it) finds a command

[build-system]
requires = ["hatchling>=1.27,<2"]  # pinned: Metadata-Version 2.4+ (F8)
build-backend = "hatchling.build"

[tool.hatch.version]
# One version source: the engine reports __version__ (X-Locus-Version, locus_diagnose_connection).
path = "src/locus/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/locus"]

# IP-008: the sdist is an allowlist. Hatchling's default sdist is "everything git tracks", which
# for a repo that holds private planning and website folders means those folders would be published with the
# package. scripts/check_dist_contents.py fails the package workflow if
# anything outside this list (plus the PKG-INFO and .gitignore hatchling adds) gets in.
[tool.hatch.build.targets.sdist]
only-include = ["src/locus", "pyproject.toml", "docs/package/README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "e2e: installs the engine into a temporary environment and drives it end to end (runs in CI; about 15 s)",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
