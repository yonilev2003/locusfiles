name: User journey

# A new user's first ten minutes, run as a script on a clean runner: install, doctor, index the demo folder, ask,
# speak MCP over stdio, pause and resume (scripts/user_journey.py). It reports what works on each operating system
# and never blocks a merge. Run it by hand after a release to check what PyPI actually serves, and nightly.
on:
  workflow_dispatch:
    inputs:
      package:
        description: "Requirement to install (default: the newest release or pre-release on PyPI)"
        default: "locusfiles[local]"
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

jobs:
  journey:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv
      - name: Run the journey
        shell: bash
        env:
          PACKAGE: ${{ inputs.package || 'locusfiles[local]' }}
        run: python scripts/user_journey.py --package "$PACKAGE" --prerelease --fresh-model --report journey.json
      - name: Summary
        if: always()
        shell: bash
        run: |
          echo '### User journey, ${{ matrix.os }}' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat journey.json >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo 'no report' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
