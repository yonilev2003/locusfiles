name: OS matrix

# Runs the offline test suite on Linux, macOS and Windows, and the clean-install smoke from the built wheel on
# each, so that "tested on <OS>" can be written down with a link to a run. Manual only: macOS bills about ten
# times and Windows about twice the Linux rate. Nothing here publishes anything. Linux blocks; macOS and Windows
# report (continue-on-error), because Windows is not claimed as supported yet. The result is a table in each
# run's summary: copy it into the compatibility matrix with the run link and the date.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: os-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, python: "3.11" }
          - { os: ubuntu-24.04, python: "3.12" }
          - { os: macos-14, python: "3.12" }
          - { os: windows-latest, python: "3.12" }
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os != 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Test suite (offline hash embedder, no network)
        id: suite
        shell: bash
        env:
          LOCUS_EMBEDDER: hash
          LOCUS_DATA_DIR: ${{ runner.temp }}/locus-ci-data
        run: |
          set +e
          pytest -q -rs -p no:cacheprovider 2>&1 | tee suite.log
          code=${PIPESTATUS[0]}
          {
            echo "### Tests: ${{ matrix.os }}, Python ${{ matrix.python }}"
            echo ""
            echo "Result: $(tail -n 1 suite.log)"
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code

  clean-install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os != 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m build
      - run: python scripts/check_dist_contents.py dist
      - name: Install the wheel into a clean environment and run the smoke test
        shell: bash
        run: |
          set +e
          python scripts/package_smoke.py --wheel dist --installer venv --extras local 2>&1 | tee smoke.log
          code=${PIPESTATUS[0]}
          {
            echo "### Clean install: ${{ matrix.os }}"
            echo ""
            echo "Result: $(tail -n 1 smoke.log)"
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code
