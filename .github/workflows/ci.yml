name: CI

# Pull requests and manual runs get CI; main runs on every merge. A newer push to the same PR
# cancels the older run. `test` and `gitleaks` always run.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      # `relay` too, so the dormant relay code (off in 0.2.0) imports here; this repository has no relay tests.
      - run: pip install -e ".[dev,relay]" "ruff==0.16.7"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: pytest -q -rs
        env:
          LOCUS_EMBEDDER: hash
          LOCUS_DATA_DIR: ${{ runner.temp }}/locus-ci-data

  # Windows is not supported yet (README says so): this job only reports what fails, and never blocks a merge.
  test-windows:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q -rs
        env:
          LOCUS_EMBEDDER: hash
          LOCUS_DATA_DIR: ${{ runner.temp }}\locus-ci-data

  # Committed secrets: scans the patch of every commit reachable from the tested ref, not just the
  # tip (a key deleted in a later commit is still leaked). Merge commits are scanned as their diff
  # against the first parent. Pinned release + checksum instead of a third-party action; read-only
  # token, not persisted into .git/config. Exceptions live in .gitleaks.toml. A real hit means
  # rotate the key first.
  gitleaks:
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: "8.28.0"
      GITLEAKS_SHA256: "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan full history of the tested ref, merge commits included
        run: >-
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose
          --config .gitleaks.toml --log-opts="--full-history --diff-merges=first-parent HEAD" .
