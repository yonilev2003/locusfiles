name: Smoke (real model)

# Installs the package the way a user does, downloads the real embedding model, indexes the demo folder and
# checks that the right file comes first. It reports what works on each operating system and never blocks a merge.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        # `macos-14` was cancelled within a second on every run ("The configuration 'macos-14-arm64-us-default' is not
        # supported"); `macos-latest` is what package.yml uses and it gets a runner.
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install like a user
        run: pip install ".[local]"
      - name: Doctor, index the demo folder, ask one question
        shell: bash
        env:
          LOCUS_EMBEDDER: local
          LOCUS_DATA_DIR: ${{ runner.temp }}/locus-smoke
        run: |
          locus doctor
          locus index tests/fixtures/demo-vault
          locus query "why did the annual discount change from two months free, and what is the new Solo annual price" -k 4 | tee out.txt
          grep -q "pricing-review" out.txt
